<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEM Contract Management System</title>
    
    <!-- External CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/contracts.css') }}">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header contracts-header">
            <div class="header-content">
                <h1>
                    <img src="/logo.png" alt="GEM Logo" style="width: 165px; height: 58px; margin-right: 15px; border: 2px solid black; background: white; vertical-align: middle;">
                    GEM Contract Management
                </h1>
                
                <!-- Notification Bell -->
                <div class="notification-bell" id="notificationBell" title="New Contracts">
                    <i class="fas fa-bell"></i>
                    <span class="notification-count" id="notificationCount">0</span>
                </div>
            </div>
        </div>
        
        <!-- Action Buttons Row -->
        <div style="display: flex; justify-content: flex-end; align-items: center; padding: 0.75rem 1.5rem; gap: 0.75rem; background: #f8fafc; border-bottom: 1px solid #e2e8f0;">
            <a href="/" class="btn btn-primary" style="padding: 0.5rem 1rem; font-size: 0.875rem; white-space: nowrap; display: inline-flex; align-items: center; gap: 0.5rem; background: var(--primary-color); border-color: var(--primary-dark);">
                <i class="fas fa-upload"></i> Upload PDF
            </a>
            <button id="exportBtn" class="btn btn-primary" style="padding: 11px 1rem; font-size: 0.875rem; white-space: nowrap; display: inline-flex; align-items: center; gap: 0.5rem; background: var(--primary-color); border: none; cursor: pointer;">
                <i class="fas fa-file-excel"></i> Export to Excel
            </button>
        </div>
        
        <!-- Filters Row -->
        <div class="search-section" style="padding: 1rem 1.5rem; background: white; border-bottom: 1px solid #e2e8f0; margin-left: -17px;">
            <div style="display: flex; gap: 0.75rem; align-items: stretch; flex-wrap: wrap;">
                <!-- Search Input -->
                <div style="position: relative; flex: 1; min-width: 280px; max-width: 400px;">
                    <input type="text" id="searchInput" class="search-input" placeholder="Search contracts by ID, organization, seller..." style="width: 100%; height: 38px; padding: 0.5rem 2.5rem 0.5rem 1rem; border: 2px solid #1e40af; border-radius: 6px; font-size: 0.875rem; background: white; box-sizing: border-box;">
                    <button id="clearSearchBtn" class="clear-search-btn" title="Clear search" style="position: absolute; right: 0.5rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: #64748b; cursor: pointer; padding: 0.25rem; display: none; font-size: 0.875rem;">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                
                <!-- State Select -->
                <div style="position: relative; flex: 0 0 auto; min-width: 220px;">
                    <select id="stateSearchSelect" class="state-search-select" style="width: 100%; height: 38px;">
                        <option value="">Select Seller State</option>
                        <option value="Andhra Pradesh">Andhra Pradesh</option>
                        <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                        <option value="Assam">Assam</option>
                        <option value="Bihar">Bihar</option>
                        <option value="Chhattisgarh">Chhattisgarh</option>
                        <option value="Goa">Goa</option>
                        <option value="Gujarat">Gujarat</option>
                        <option value="Haryana">Haryana</option>
                        <option value="Himachal Pradesh">Himachal Pradesh</option>
                        <option value="Jharkhand">Jharkhand</option>
                        <option value="Karnataka">Karnataka</option>
                        <option value="Kerala">Kerala</option>
                        <option value="Madhya Pradesh">Madhya Pradesh</option>
                        <option value="Maharashtra">Maharashtra</option>
                        <option value="Manipur">Manipur</option>
                        <option value="Meghalaya">Meghalaya</option>
                        <option value="Mizoram">Mizoram</option>
                        <option value="Nagaland">Nagaland</option>
                        <option value="Odisha">Odisha</option>
                        <option value="Punjab">Punjab</option>
                        <option value="Rajasthan">Rajasthan</option>
                        <option value="Sikkim">Sikkim</option>
                        <option value="Tamil Nadu">Tamil Nadu</option>
                        <option value="Telangana">Telangana</option>
                        <option value="Tripura">Tripura</option>
                        <option value="Uttar Pradesh">Uttar Pradesh</option>
                        <option value="Uttarakhand">Uttarakhand</option>
                        <option value="West Bengal">West Bengal</option>
                        <option value="Andaman and Nicobar Islands">Andaman and Nicobar Islands</option>
                        <option value="Chandigarh">Chandigarh</option>
                        <option value="Dadra and Nagar Haveli and Daman and Diu">Dadra and Nagar Haveli and Daman and Diu</option>
                        <option value="Delhi">Delhi</option>
                        <option value="Jammu and Kashmir">Jammu and Kashmir</option>
                        <option value="Ladakh">Ladakh</option>
                        <option value="Lakshadweep">Lakshadweep</option>
                        <option value="Puducherry">Puducherry</option>
                    </select>
                    <button id="clearStateSearchBtn" class="clear-state-search-btn" title="Clear state search" style="position: absolute; right: 1.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: #64748b; cursor: pointer; padding: 0.25rem; display: none; font-size: 0.875rem; z-index: 10;">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <!-- Date From -->
                <div style="position: relative; flex: 0 0 auto; width: 170px;">
                    <input type="text" id="dateFrom" class="date-input" placeholder="DD/MM/YYYY" style="width: 100%; height: 38px; padding: 0.5rem 2.25rem 0.5rem 0.75rem; border: 2px solid #1e40af; border-radius: 6px; font-size: 0.875rem; background: white; box-sizing: border-box; cursor: pointer;">
                    <button id="clearDateFromBtn" class="clear-date-from-btn" title="Clear from date" style="position: absolute; right: 0.25rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: #64748b; cursor: pointer; padding: 0.25rem; display: none; font-size: 0.875rem;">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <!-- Date To -->
                <div style="position: relative; flex: 0 0 auto; width: 170px;">
                    <input type="text" id="dateTo" class="date-input" placeholder="DD/MM/YYYY" style="width: 100%; height: 38px; padding: 0.5rem 2.25rem 0.5rem 0.75rem; border: 2px solid #1e40af; border-radius: 6px; font-size: 0.875rem; background: white; box-sizing: border-box; cursor: pointer;">
                    <button id="clearDateToBtn" class="clear-date-to-btn" title="Clear to date" style="position: absolute; right: 0.25rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: #64748b; cursor: pointer; padding: 0.25rem; display: none; font-size: 0.875rem;">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <!-- Clear All Filters Button -->
                <button id="clearAllFiltersBtn" class="clear-all-filters-btn" title="Clear all filters" style="flex: 0 0 auto; height: 38px; padding: 0 1rem; background: #1e40af; color: white; border: none; border-radius: 6px; cursor: pointer; display: none; align-items: center; justify-content: center; font-size: 0.875rem; font-weight: 600; transition: all 0.2s ease; gap: 0.5rem;">
                    <i class="fas fa-times-circle"></i>
                    <span>Clear All</span>
                </button>
            </div>
        </div>

        <!-- Contracts Table -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Organization Details</th>
                        <th>Seller Details</th>
                        <th>Buyer Details</th>
                        <th>Product Details</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Data will be populated by JavaScript -->
                </tbody>
            </table>
        </div>
        
        <!-- Pagination Container -->
        <div id="pagination-container" class="pagination-container" style="background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%) !important; border-radius: 0px; padding: 3px !important; margin: 2rem 0; box-shadow: 0 8px 20px rgba(30, 64, 175, 0.25); border: 2px solid rgba(255, 255, 255, 0.2);">
            <!-- Pagination will be generated by JavaScript -->
        </div>
    </div>

    <!-- jQuery (required for Select2) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Select2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <!-- Flatpickr JS -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    
    <!-- Custom JavaScript -->
    <script src="{{ url_for('static', filename='js/contracts.js') }}"></script>
    
    <!-- Initialize data -->
    <script>
        // Pass data from Flask to JavaScript
        const contractsData = {{ contracts_json|safe }};
        const perPageValue = {{ per_page }};
        
        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            initializeContractsData(contractsData, perPageValue);
        });
    </script>
</body>
</html>
